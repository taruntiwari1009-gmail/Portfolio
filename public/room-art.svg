<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#271a19"/><stop offset=".5" stop-color="#50302a"/><stop offset="1" stop-color="#241713"/></linearGradient>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#45446a"/><stop offset=".3" stop-color="#876d87"/><stop offset=".58" stop-color="#d27f79"/><stop offset=".78" stop-color="#f3a764"/><stop offset="1" stop-color="#62453d"/></linearGradient>
 <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#88512c"/><stop offset=".35" stop-color="#4a2b19"/><stop offset="1" stop-color="#25140e"/></linearGradient>
 <radialGradient id="lampglow"><stop stop-color="#ffc56d" stop-opacity=".9"/><stop offset="1" stop-color="#f0a14b" stop-opacity="0"/></radialGradient>
 <linearGradient id="book"><stop stop-color="#513a25"/><stop offset="1" stop-color="#1c120c"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .05"/></feComponentTransfer></filter>
</defs>
