name: Portfolio build check
on:
  pull_request:
    branches: [main]
  push:
    branches: [redesign/life-in-progress, redesign/personal-collage-v3, portfolio/lovable-recreation-pr15]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lint
      - run: bun run test
