name: Portfolio build check
on:
  pull_request:
    branches: [main]
  push:
    branches: [redesign/life-in-progress, redesign/personal-collage-v3, redesign/story-walkthrough]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
